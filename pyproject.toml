[project]
name = "secureagentops"
version = "0.1.0"
description = "Secure, multi-tenant AI agent platform: LangGraph orchestration, tenant-isolated RAG, approval-gated tools and built-in observability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0.30",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "langgraph>=0.2.60",
    "chromadb>=1.0",
    "pypdf>=5.0",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
bedrock = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:opentelemetry.*",
]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "RET", "ASYNC"]
ignore = [
    "B008",   # FastAPI's Depends() in argument defaults is the documented pattern
    "RUF012", # class-level constant mappings
    "SIM905", # "a b c".split() reads better than a 60-line list for word lists
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"frontend/**" = ["S113"]

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]
